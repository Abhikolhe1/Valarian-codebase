name: Deploy Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: valiarian-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Set deployment SHA
        run: echo "DEPLOY_SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.PROD_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Sync repository to exact commit
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.PROD_SSH_PORT }}" \
            -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes \
            "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" \
            "set -euo pipefail && cd /var/www/valiarian/Valarian-codebase && git fetch origin && git reset --hard ${DEPLOY_SHA}"
      - name: Deploy production
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.PROD_SSH_PORT }}" \
            -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes \
            "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" \
            "bash /var/www/valiarian/Valarian-codebase/scripts/deploy-production.sh ${DEPLOY_SHA}"
      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
      - name: Job summary
        if: always()
        run: |
          echo "## Production Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${DEPLOY_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Storefront: https://valiarian.com" >> "$GITHUB_STEP_SUMMARY"
          echo "Backend: https://api.valiarian.com/health" >> "$GITHUB_STEP_SUMMARY"
          echo "Admin: https://admin.valiarian.com" >> "$GITHUB_STEP_SUMMARY"
