server {
    server_name uat.valiarian.com;

    # Keep every UAT response out of search indexes, including routes that
    # are not covered by robots.txt or are discovered through external links.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /sitemap.xml {
        proxy_pass http://localhost:3055/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }

    location /api {
        proxy_pass http://localhost:3055;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/uat.valiarian.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/uat.valiarian.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = uat.valiarian.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name uat.valiarian.com;
    listen 80;
    return 404; # managed by Certbot
}
