server {
    server_name valiarian.com;

    location = /sitemap.xml {
        proxy_pass http://localhost:3035/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Public SEO documents are pre-rendered during deployment. The narrowly
    # scoped locations below leave auth, cart, checkout, payment and orders on
    # the existing React SPA upstream.
    location = / {
        if (-f /var/www/maintenance/frontend.flag) {
            return 503;
        }
        root /var/www/valiarian/Valarian-codebase/valiarian-frontend/build;
        try_files /seo/routes/index.html @production_storefront_spa;
    }

    location = /products {
        if (-f /var/www/maintenance/frontend.flag) {
            return 503;
        }
        root /var/www/valiarian/Valarian-codebase/valiarian-frontend/build;
        try_files /seo/routes/products/index.html @production_storefront_spa;
    }

    location = /products/checkout {
        if (-f /var/www/maintenance/frontend.flag) {
            return 503;
        }
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ~ ^/(products|category)/[^/]+$ {
        if (-f /var/www/maintenance/frontend.flag) {
            return 503;
        }
        root /var/www/valiarian/Valarian-codebase/valiarian-frontend/build;
        try_files /seo/routes$uri/index.html @production_storefront_spa;
    }

    location @production_storefront_spa {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }

    location / {
        # Maintenance/coming-soon gate: toggled by presence of this flag file.
        # Enable:  touch /var/www/maintenance/frontend.flag
        # Disable: rm -f /var/www/maintenance/frontend.flag
        # Instant — no nginx reload or app rebuild needed either way.
        if (-f /var/www/maintenance/frontend.flag) {
            return 503;
        }

        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }

    error_page 503 /maintenance.html;
    location = /maintenance.html {
        root /var/www/maintenance;
        internal;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/valiarian.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/valiarian.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = valiarian.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name valiarian.com;
    return 404; # managed by Certbot
}
