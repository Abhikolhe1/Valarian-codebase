<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- Favicon -->
  <link rel="icon" href="%PUBLIC_URL%/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/favicon/apple-touch-icon.png">

  <!-- Using Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Razorpay Checkout Script -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <title>Valiarian | Premium Clothing</title>
  <meta name="description"
    content="Discover Valiarian's premium clothing, crafted with refined design, exceptional comfort, and timeless style for the modern wardrobe." />
  <link rel="canonical" href="https://valiarian.com/" />

  <!-- Social sharing metadata (WhatsApp, Facebook, LinkedIn, X) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Valiarian" />
  <meta property="og:url" content="https://valiarian.com/" />
  <meta property="og:title" content="Valiarian | Premium Clothing" />
  <meta property="og:description"
    content="Discover Valiarian's premium clothing, crafted with refined design, exceptional comfort, and timeless style for the modern wardrobe." />
  <meta property="og:image"
    content="https://valiarian.com/assets/images/social/valiarian-share-preview.jpeg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="4277" />
  <meta property="og:image:height" content="2406" />
  <meta property="og:image:alt" content="Valiarian premium clothing collection" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Valiarian | Premium Clothing" />
  <meta name="twitter:description"
    content="Discover Valiarian's premium clothing, crafted with refined design, exceptional comfort, and timeless style for the modern wardrobe." />
  <meta name="twitter:image"
    content="https://valiarian.com/assets/images/social/valiarian-share-preview.jpeg" />

  <!-- Site Settings Loader - Loads before React -->
  <script src="%PUBLIC_URL%/site-settings.js"></script>

  <!-- Disable automatic scroll restoration -->
  <script>
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }
  </script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>

</html>
